<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App发布看板</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#294061;--line:#3b4a63;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#4ade80;--err:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#14213a;border-bottom:1px solid var(--line);height:52px;flex-shrink:0}
header h1{font-size:17px;font-weight:700;white-space:nowrap}
header .tag{color:var(--mut);font-size:12px;margin-left:10px}
.hdr-right{display:flex;gap:8px;align-items:center}
button{background:var(--acc);color:#0a1628;border:none;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
button.secondary{background:#23395e;color:var(--txt);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.layout{display:flex;flex:1;overflow:hidden}
aside{width:230px;flex-shrink:0;background:#14213a;border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
aside .cat-title{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 6px;font-weight:600}
aside .app-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt);margin-bottom:2px}
aside .app-item:hover{background:#22406b}
aside .app-item.active{background:var(--acc);color:#0a1628;font-weight:600}
aside .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
main{flex:1;overflow-y:auto;padding:18px 22px 40px;background:var(--bg)}
.app-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-head h2{font-size:20px}
.badge{background:#23395e;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--txt)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.err{color:var(--err);border-color:var(--err)}
.scroll{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{font-size:13.5px;color:var(--acc);margin-bottom:10px}
.card .row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;border-bottom:1px dashed #2c3e59}
.card .row:last-child{border:none}
.k{color:var(--mut)}
.v{color:var(--txt);max-width:65%;text-align:right;word-break:break-all}
.input-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.input-row input{flex:1;background:#0d1626;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;min-width:0}
input,select,textarea{background:#0d1626;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;width:100%}
textarea{min-height:48px;resize:vertical}
form-row{display:flex;gap:10px}
form-row>*{flex:1}
label{display:block;color:var(--mut);font-size:11px;margin:8px 0 3px}
.check{display:flex;align-items:center;gap:6px;margin:10px 0;font-size:12.5px;color:var(--txt)}
.check input{width:auto}
.actions{display:flex;gap:8px;margin:10px 0}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.status-grid .card .state{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.state{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.state.published{background:#14532d;color:var(--ok)}
.state.reviewing{background:#78350f;color:var(--warn)}
.state.draft,.state.submitted{background:#1e3a5f;color:var(--acc)}
.state.rejected{background:#7f1d1d;color:var(--err)}
.state.unknown{background:#23395e;color:var(--mut)}
.result{background:#0a1322;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:"SF Mono",Menlo,monospace;font-size:12px;line-height:1.6;max-height:220px;overflow-y:auto}
.result div{white-space:pre-wrap;word-break:break-all}
.result .ok{color:var(--ok)}
.result .err{color:var(--err)}
.hide{display:none}
.muted{color:var(--mut);font-size:12px}
#tsteps{font-size:12px;max-height:130px;overflow-y:auto;margin-top:8px;color:var(--txt)}
#tsteps div{padding:2px 0;display:flex;align-items:center;gap:6px}
#tsteps div .icn{font-size:14px;flex-shrink:0}
#tsteps div .icn.ok{color:var(--ok)}
#tsteps div .icn.err{color:var(--err)}
#tsteps div .icn.cur{color:var(--acc);animation:pulseicn 1s infinite}
@keyframes pulseicn{0%,100%{opacity:1}50%{opacity:.4}}
#tinfo{font-size:14px;font-weight:600;margin-bottom:4px}
#tstage{font-size:12.5px;color:var(--acc);margin:4px 0}
#tmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:4px}
#tmeta .tchip{background:#23395e;border-radius:12px;padding:2px 10px;display:inline-flex;align-items:center;gap:4px}
#tmeta .tchip.ok{background:#14532d;color:var(--ok)}
#tmeta .tchip.err{background:#7f1d1d;color:var(--err)}
#tmeta .tchip.run{background:#1e3a5f;color:var(--acc)}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:380px;max-width:90vw;max-height:70vh;overflow-y:auto}
.file-item{padding:8px 6px;border-bottom:1px dashed #1f2d47;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.file-item:hover{background:#1d3357}
.file-item .fname{flex:1}
@media(max-width:760px){.layout{flex-direction:column}aside{width:100%;max-height:140px}.grid{grid-template-columns:1fr}}
.plat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px}
.plat-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;cursor:pointer}
.plat-item input{width:auto;margin:0}

</style>
</head>
<body>
<header>
  <div style=display:flex;align-items:center;gap:12px><h1>App发布看板</h1><span class=muted id=cfg></span></div>
  <div class=hdr-right><button class=secondary sm onclick=ld()>刷新</button><button class=secondary sm onclick=validateAll()>校验凭证</button></div>
</header>
<div class=layout>
  <aside id=sb></aside>
  <main>
    <div id=appc><!-- 应用详情+发布表单 --></div>
    <div id=progress class=hide><div class=card>
      <div style=display:flex;justify-content:space-between;align-items:start;gap:8px><div><b style=font-size:14px id=tinfo></b><div id=tmeta></div></div><button class="secondary sm" onclick=stopPoll() id=tclose style=display:none>×</button></div>
      <div id=tstage></div>
      <div id=tup style="font-size:12px;color:var(--acc);margin-top:5px;min-height:16px"></div>
      <div id=tsteps></div>
    </div></div>
    <div class=scroll>
      <div><h3 style=color:var(--acc);font-size:14px;margin-bottom:8px>平台状态</h3><div id=sg class=status-grid><div class=muted>点击「查询状态」查看</div></div></div>
      <div><div style=display:flex;justify-content:space-between;align-items:center;margin-bottom:8px><h3 style=color:var(--acc);font-size:14px;margin:0>发布历史</h3><button class="secondary sm" onclick=clearHistory()>清空</button></div><div id=sh><div class=muted>暂无发布记录</div></div></div>
      <div><h3 style=color:var(--acc);font-size:14px;margin-bottom:8px>日志</h3><div id=lg class=result><div>就绪</div></div></div>
    </div>
  </main>
</div>
<div id=toast class=overlay style=display:none></div>
<script>
var ST={apps:[],cats:[],cur:null,plt:[],POLL:null};
function $(v){return document.getElementById(v)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(p,o){return fetch(p,o).then(function(r){return r.json().catch(function(){return{}})})}
function toast(m,t){var e=$("toast");e.style.display="flex";e.innerHTML='<div class="modal" style="width:auto;max-width:400px;text-align:center">'+esc(m)+'<div style="margin-top:12px"><button id=tb>确定</button></div></div>';e.style.background="transparent";clearTimeout(e._t);e._t=setTimeout(close,2600);var b=e.querySelector('#tb');if(b)b.addEventListener('click',close)}
function close(){ $("toast").style.display="none" }
function lg(t,c){var e=$("lg");if(e){var d=document.createElement("div");d.className=c||"";d.textContent=t;e.appendChild(d);e.scrollTop=e.scrollHeight}}
function busy(o){document.querySelectorAll("button,input,select,textarea").forEach(function(b){b.disabled=o})}
function stat(ch){var m={published:"已上架",reviewing:"审核中",draft:"草稿",submitted:"已提交",rejected:"被驳回",unknown:"未知"};return m[ch]||ch}
function ld(){Promise.all([api("/api/apps"),api("/api/platforms"),api("/api/config"),api("/api/tasks")]).then(function(rs){ST.apps=rs[0].apps||[];ST.cats=rs[0].categories||[];ST.platforms=rs[1]||[];$("cfg").textContent="凭证: "+(rs[2].credentials||"");renderSb();if(ST.apps.length){if(!ST.cur||!ST.apps.find(function(a){return a.id===ST.cur.id}))sa(ST.apps[0].id);else renderMain()}var hist=(rs[3]&&rs[3].history)||[];renderHistory(hist.slice(0,8))}).catch(function(e){console.error(e)})}
function renderSb(){var h="";(ST.cats||[]).forEach(function(c){h+='<div class=cat-title>'+esc(c.name)+"</div>";(ST.apps||[]).filter(function(a){return a.category===c.name}).forEach(function(a){var act=ST.cur&&ST.cur.id===a.id?"active":"";var dot=a.package_name?'<span class=dot style=background:var(--ok)></span>':'<span class=dot style=background:var(--warn)></span>';h+='<div class="app-item '+act+'" data-id="'+esc(a.id)+'" onclick="sa(this.dataset.id)">'+dot+'<span>'+esc(a.name)+"</span></div>"})});$("sb").innerHTML=h}
function sa(id){ST.cur=(ST.apps||[]).find(function(a){return a.id===id})||null;renderSb();renderMain()}
function renderMain(){if(!ST.platforms&&!ST.apps.length){setTimeout(renderMain,250);return}var a=ST.cur;if(!a){$("appc").innerHTML='<div class=muted>请选择左侧应用</div>';return}
var h='<div class=app-head><h2>'+esc(a.name)+'</h2>'+(a.category_display?'<span class=badge>'+esc(a.category_display)+'</span>':'')+(a.package_name?'<span class="badge" style=color:var(--ok)>'+esc(a.package_name)+'</span>':'<span class="badge err">未配包名</span>')+'<span class=muted>'+(a.version_name?"v"+esc(a.version_name):"")+"</span></div>";
h+='<div class=grid><div class=card><h3>应用信息</h3>'+
'<div class=row><span class=k>包名</span><span class=v>'+esc(a.package_name||"未填")+'</span></div>'+
'<div class=row><span class=k>versionName</span><span class=v>'+esc(a.version_name||"-")+'</span></div>'+
'<div class=row><span class=k>versionCode</span><span class=v>'+(a.version_code==null?"-":a.version_code)+'</span></div>'+(a.huawei_harmony_package?'<div class=row><span class=k>华为 Harmony 包</span><span class=v>'+esc(a.huawei_harmony_package)+'</span></div>':"")+'</div>';
h+='<div class=card><h3>构建产物</h3>'+
'<div class=input-row><input id=paab value="'+esc(a.aab_build||"")+'" placeholder="AAB (Google Play)"><button class=sm secondary onclick=fp("aab")>检测</button><button class=sm secondary onclick=clr("paab")>清</button></div>'+
'<div class=input-row><input id=papk value="'+esc(a.apk_build||"")+'" placeholder="APK (国内平台)"><button class=sm secondary onclick=fp("apk")>检测</button><button class=sm secondary onclick=clr("papk")>清</button></div>'+
(a.aab_exists?'<span class=badge style=color:var(--ok)>AAB 存在</span> ':"")+(a.apk_exists?'<span class=badge style=color:var(--ok)>APK 存在</span>':"")+'<div id=papkAlert style=font-size:12px;margin:4px 0;min-height:16px></div><div style=margin-top:4px><button onclick=pth()>保存路径</button></div></div>';
h+='<div class=card><h3>发布</h3>'+
'<div><label>版本名</label><input id=ipvn readonly value="'+(a.version_name||"")+'"></div>'+
'<div><label>versionCode</label><input id=ipvc readonly value="'+(a.version_code==null?"":a.version_code)+'"></div>'+
'<div><label>发布平台（可多选，Apple 仅查询）</label><div id=ipp style=display:flex;flex-wrap:wrap;gap:8px>'+publishPlatsHTML()+'</div><div style=margin-top:6px><button type=button class=sm secondary onclick=platAll(1)>全选</button> <button type=button class=sm secondary onclick=platAll(0)>清空</button></div></div>'+
'<div><label>轨道（Google）</label><select id=ipv><option>production</option><option>beta</option><option>alpha</option><option>internal</option></select></div>'+
'<div><label>更新说明</label><textarea id=ipn rows=2></textarea><div class=form-group><label>定时上线（留空=立即）</label><input id=pot type=datetime-local></div></div>'+
'<div class=check><input type=checkbox id=ipdry checked><label for=ipdry>仅校验（dry-run）</label> <input type=checkbox id=ipauto style=margin-left:14px><label for=ipauto>Google 自动送审（不勾=存草稿）</label></div>'+
'<div class=actions>'+(a.query_only?'<button class=secondary disabled title="仅查询应用不支持发布">发布于 AGC 控制台</button>':'<button onclick=dpub()>发布</button>')+'<button class=secondary onclick=ds()>查询状态</button></div></div></div>';
$("appc").innerHTML=h}
function row(k,v){return'<div class=row><span class=k>'+esc(k)+'</span><span class=v>'+v+"</span></div>"}
function clr(x){$(x).value="";pth()}
function fp(t){var a=ST.cur;if(!a)return;api("/api/files").then(function(f){var l=(f&&f[t])||[];if(!l.length){toast("未检测到"+t.toUpperCase()+"文件","err");return}
var h='<div class="overlay" onclick="if(event.target===this)cm()"><div class="modal"><h3 style=margin-bottom:8px>选择 '+t.toUpperCase()+" 文件</h3>";(l||[]).forEach(function(x){var z=x.size>1e6?(x.size/1e6).toFixed(1)+" MB":Math.max(1,Math.round(x.size/1e3))+" KB";h+='<div class="file-item" data-type="'+t+'" data-path="'+esc(x.path)+'" onclick="pick(this)"><span class=fname>'+esc(x.name)+'</span><span class=muted>'+z+"</span></div>"});h+='<div style=margin-top:10px;text-align:right><button class=secondary onclick=cm()>取消</button></div></div></div>';var d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d.firstElementChild)})}
function pick(el){var t=el.dataset.type,p=el.dataset.path;var inp=$(t==="aab"?"paab":"papk");inp.value=p;cm();toast("已选: "+p.split("/").pop());if(ST.cur)autoMeta(p,ST.cur.id,t)}
function cm(){document.querySelectorAll(".overlay").forEach(function(e){if(e.id!=="toast")e.remove()})}
function pth(){var a=ST.cur;if(!a)return;var ab=$("paab").value.trim(),ap=$("papk").value.trim();busy(true);api("/api/apps/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({app_id:a.id,aab_build:ab,apk_build:ap})}).then(function(r){if(r.ok){lg("路径已保存","ok");toast("路径已保存");if(ap&&!r.error)autoMeta(ap,a.id,"apk");if(ab&&!r.error)autoMeta(ab,a.id,"aab")}else{lg("保存失败: "+JSON.stringify(r),"err")}}).finally(function(){busy(false)})}
function publishPlatsHTML(){var pubs=(ST.platforms||[]).filter(function(p){return p.platform!=="apple"});var labelMap={huawei:"华为",oppo:"OPPO",vivo:"VIVO",xiaomi:"小米",honor:"荣耀",google:"Google Play"};return pubs.map(function(p){var nm=labelMap[p.platform]||p.display_name;var badge=p.availability==="ready"?"":"(骨架)";return '<label class=plat-item><input type=checkbox class=plat-cb value="'+p.platform+'" '+""+'><span>'+nm+'</span>'+badge+'</label>'}).join("")}
function platAll(on){document.querySelectorAll(".plat-cb").forEach(function(c){c.checked=!!on})}
function selPlats(){var arr=[];document.querySelectorAll(".plat-cb:checked").forEach(function(c){arr.push(c.value)});return arr.length?arr.join(","):"all"}
function autoMeta(path,appId,type){type=type||(path.toLowerCase().endsWith(".aab")?"aab":"apk");
api("/api/apk/meta",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:path})}).then(function(r){if(!r.ok){lg((type==="aab"?"AAB":"APK")+"解析失败: "+(r.error||"失败"),"err");return}
var a=ST.cur;var al=$("papkAlert");var msg="";
var exp=((a&&a.package_name)||"").trim();var real=(r.package_name||"").trim();
if(exp&&real){if(real!==exp){msg='<span style="color:var(--err)">⚠️ 包名不一致：安装包='+esc(real)+' vs 配置='+esc(exp)+'</span>';lg("包名不一致! "+real+" ≠ "+exp,"err");if(al)al.innerHTML=msg}
else{msg='<span style="color:var(--ok)">✓ 包名一致：'+esc(real)+'</span>';lg("包名一致: "+real,"ok");if(al)al.innerHTML=msg}}
// 版本信息回填（APK 有；AAB 目前只解析出包名）
if($("ipvn"))$("ipvn").value=r.version_name||($("ipvn").value||"");
if($("ipvc"))$("ipvc").value=(r.version_code==null?($("ipvc").value||""):r.version_code);
// 保存选择路径 + 版本到目录
var fields={app_id:appId};if(type==="aab")fields.aab_build=path;else fields.apk_build=path;
if(r.version_name)fields.version_name=r.version_name;
if(r.version_code!=null)fields.version_code=r.version_code;
api("/api/apps/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(fields)}).then(function(){lg("已保存 "+(type==="aab"?"AAB":"APK")+" 路径与版本","ok");if(ST.cur&&ST.cur.id===appId){
ST.cur.version_name=r.version_name||ST.cur.version_name;ST.cur.version_code=(r.version_code!=null?r.version_code:ST.cur.version_code);
// 就地更新应用信息显示（不整卡重渲染，避免打断其他操作）
if(r.version_name){var sp=document.querySelector('#appc .app-head .muted');if(sp)sp.textContent="v"+r.version_name}
var rows=document.querySelectorAll('#appc .card .row');rows.forEach(function(ro){var k=ro.querySelector('.k');if(!k)return;if(k.textContent==='versionName'&&r.version_name){var v=ro.querySelector('.v');if(v)v.textContent=r.version_name}if(k.textContent==='versionCode'&&r.version_code!=null){var v2=ro.querySelector('.v');if(v2)v2.textContent=r.version_code}});
}})
})}
function dpub(){var a=ST.cur;if(!a||!a.package_name){toast("请选择应用（需配包名）","err");return}
var body={app_id:a.id,platform:selPlats(),dry_run:$("ipdry").checked,auto_review:$("ipauto").checked,version_name:$("ipvn").value.trim(),version_code:parseInt($("ipvc").value)||null,release_notes:$("ipn").value.trim(),track:$("ipv").value,aab_path:$("paab").value.trim(),apk_path:$("papk").value.trim(),online_time:document.getElementById("pot")?document.getElementById("pot").value.trim():""};
lg("== "+(body.dry_run?"Dry-run":"正式")+"发布 "+(a.name||a.id)+" ==");busy(true);api("/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(r.task_id){lg("任务: "+r.task_id);startPoll(r.task_id)}else{lg("启动失败: "+JSON.stringify(r),"err");busy(false)}})}
function startPoll(tid){ST.POLL=tid;$("progress").classList.remove("hide");$("tsteps").innerHTML="";poll()}
function poll(){if(!ST.POLL)return;api("/api/tasks/"+ST.POLL).then(function(t){if(t.error){lg("查询失败","err");stopPoll();return}
var a=(ST.apps||[]).find(function(z){return z.id===t.app_id})||{};
$("tinfo").textContent=esc(a.name||t.app_id)+" → "+esc(t.platform)+(t.dry_run?" ⚡dry-run":"");
// === 平台芯片：✓完成/✗失败/⚡进行中/灰色待处理 ===
var doneMap={},errMap={};(t.results||[]).forEach(function(v){doneMap[v.platform]=v});
(t.errors||[]).forEach(function(v){errMap[v.platform]=v});
var targets=(t.platform||"").split(",").map(function(s){return s.trim()});
var curPlat=(t.stage||"").match(/发布\s+(\S+)/);curPlat=curPlat?curPlat[1]:"";
var ps=targets.map(function(p){if(!p)return "";
  if(doneMap[p]){var v=doneMap[p];return '<span class="tchip'+(v.ok?' ok':' err')+'">'+esc(p)+(v.ok?' ✓':' ✗')+'</span>'}
  if(errMap[p])return '<span class="tchip err">'+esc(p)+' ✗</span>';
  if(p===curPlat)return '<span class="tchip run">'+esc(p)+' ⚡</span>';
  return '<span class="tchip">'+esc(p)+'</span>';
}).filter(Boolean);
$("tmeta").innerHTML=ps.join("");
// === 当前阶段（进度条已移除，以文字/步骤图标表达）===
if(t.status==="done"){$("tstage").textContent="✅ 全部完成"}
else if(t.status==="error"){$("tstage").textContent="❌ 有错误"}
else{$("tstage").textContent=t.stage||"处理中…"}
// === 上传进度：sent/total ===
var upEl=$("tup");if(upEl){var up=t.upload;if(up&&up.sent!=null){var mb1=(up.sent/1048576).toFixed(1),mb2=(up.total/1048576).toFixed(1);upEl.textContent="⬆ 上传中 "+mb1+"MB / "+mb2+"MB ("+up.pct+")"}else if(t.status==="done"||t.status==="error"){upEl.textContent=""}}
// === 步骤列表：已完成✓ / 当前⚡ / 最终✓✗ ===
var se=$("tsteps");if(t.steps&&t.steps.length>se.childNodes.length){var sl=t.steps,li=sl.length-1;
se.innerHTML=sl.map(function(s,i){var icon,cls;
  if(t.status==="running"){icon=i<li?"✓":"⚡";cls=i<li?"ok":"cur";}
  else if(t.status==="done"){icon="✓";cls="ok";}
  else{icon=i<li?"✓":"✗";cls=i<li?"ok":"err";}
  return '<div><span class="icn '+cls+'">'+icon+'</span>'+esc(s)+"</div>"
}).join("");se.scrollTop=se.scrollHeight}
// === 任务结束：日志 + 手动关闭 × ===
if(t.status==="done"||t.status==="error"){var isOk=t.status==="done";
$("tclose").style.display="inline-block";$("tclose").onclick=function(){stopPoll()};
lg("== "+(isOk?"✔ 发布成功":"✘ 发布有错误")+" ==",isOk?"ok":"err");
(t.results||[]).forEach(function(v){lg("["+v.platform+"] "+(v.ok?"✓ ":"✗ ")+v.message,v.ok?"ok":"err")});
(t.errors||[]).forEach(function(v){lg("["+v.platform+"] 错误:"+v.error,"err")});
// 任务结束：刷新发布历史显示（后端已落盘，此处重新拉取展示）
api("/api/tasks").then(function(tr){if(tr&&tr.history)renderHistory(tr.history.slice(0,8))});
busy(false)}
else{$("tclose").style.display="none";setTimeout(poll,600)}})}
function stopPoll(){ST.POLL=null;$("tclose").style.display="none";$("progress").classList.add("hide")}
function ds(){var a=ST.cur;if(!a||!a.package_name){toast("请选择应用","err");return}
lg("== 查询状态 "+a.name+" ==");busy(true);$("sg").innerHTML="<div class=muted>查询中…</div>";api("/api/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({app_id:a.id,platform:selPlats()||"all"})}).then(function(r){renderStatusGrid(r.statuses||[]);busy(false)}).catch(function(){ $("sg").innerHTML='<div class=muted>查询失败</div>';busy(false)})}
function renderStatusGrid(s){var e=document.getElementById("sg");if(!e)return;if(!s||!s.length){e.innerHTML='<div class=muted>无数据</div>';return}
var order={huawei:0,oppo:1,vivo:2,xiaomi:3,honor:4,google:5,apple:6}
var nm={huawei:"华为",oppo:"OPPO",vivo:"VIVO",xiaomi:"小米",honor:"荣耀",google:"Google Play",apple:"Apple"}
var list=(s||[]).slice().sort(function(a,b){return (order[a.platform]!==undefined?order[a.platform]:99)-(order[b.platform]!==undefined?order[b.platform]:99)});
var h="";list.forEach(function(x){
var liveArr=(x.live_version_names||[]).slice();if(!liveArr.length&&x.live_version_codes)liveArr=x.live_version_codes.map(String);
var live=liveArr.length?liveArr.join("<br>"):"-";
var rev=(x.reviewing_version_names||[]).join(", ");var draft=(x.draft_version_names||[]).join(", ");var beta=(x.beta_version_names||[]).join(", ");var alpha=(x.alpha_version_names||[]).join(", ");var inter=(x.internal_version_names||[]).join(", ");var tst=[];if(beta)tst.push("Beta:"+beta);if(alpha)tst.push("Alpha:"+alpha);if(inter)tst.push("内测:"+inter);var tstRow=tst.join(" ；");h+='<div class=card><div style="display:flex;justify-content:space-between;margin-bottom:6px;align-items:center"><b style="font-size:12px">'+esc(nm[x.platform]||x.platform)+'</b><span class="state '+x.state+'">'+stat(x.state)+'</span></div>'+row("已上架版本",'<span class=v style="white-space:pre-line">'+live+'</span>')+row("审核状态",rev?esc(rev):(x.state==="reviewing"?"审核中":"-"))+row("草稿未送审",draft?esc(draft):"-")+(tstRow?row("内测版本",esc(tstRow)):"")+'</div>'});
e.innerHTML=h}
function renderHistory(hist){var e=document.getElementById("sh");if(!e)return;if(!hist||!hist.length){e.innerHTML='<div class=muted>暂无发布记录</div>';return}
var h="";(hist||[]).forEach(function(t){var st=t.status==="done"?"ok":"err";var dn=(t.dry_run?" (dry-run)":"");h+='<div class="card" style="padding:8px 12px;margin-bottom:6px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:12px">'+esc(t.finished_at||"")+' · <b>'+esc(t.app_id)+'</b> → '+esc(t.platform||"")+dn+'</span><span class="state '+st+'">'+(t.status==="done"?"完成":"失败")+'</span></div><div style="font-size:11px;color:var(--mut);margin-top:3px">'+(t.stage||"")+"</div></div>"});e.innerHTML=h}
function clearHistory(){var h='<div class="overlay" onclick="if(event.target===this)clh()"><div class="modal" style="text-align:center;min-width:340px"><p style="margin:8px 0 14px;font-size:15px;font-weight:600">确认清空全部发布历史？</p><p style="color:var(--mut);font-size:13px;margin-bottom:20px">此操作不可撤消，历史记录将被永久删除。</p><div style="display:flex;gap:10px;justify-content:center"><button onclick=doClearHistory() style="background:var(--err)">确认清空</button><button class=secondary onclick=clh()>取消</button></div></div></div>';var d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d.firstElementChild)}
function doClearHistory(){api("/api/tasks/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(r){clh();if(r&&r.ok){lg("发布历史已清空","ok");var e=document.getElementById("sh");if(e)e.innerHTML='<div class=muted>暂无发布记录</div>'}else{lg("清空失败: "+JSON.stringify(r),"err")}})}
function clh(){document.querySelectorAll(".overlay").forEach(function(e){if(e.id!=="toast")e.remove()})}
function validateAll(){lg("== 校验凭证 ==");api("/api/validate").then(function(r){(r.validated||[]).forEach(function(x){lg("["+x.platform+"] "+(x.ok?"OK":"ERROR")+(x.message?" "+x.message:""),x.ok?"ok":"err")})})}
ld();
</script>
